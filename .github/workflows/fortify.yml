# Use the generic fortify/github-action to submit Fortify scans.
# If granular controls are required, use the following to setup the use shell commands to call scancentral and fodupload
# - fortify/github-action/setup@v1
# 
# Details of the tools definitions can be found in:
# - https://github.com/fortify/github-action/blob/main/setup/src/constants.ts
# - https://github.com/fortify/tool-definitions/tree/main/v1
# 
# If tools are needed to be hosted in airgap environment, provide the tools definition file via `TOOL_DEFINITIONS` variable when using `fortify/github-action`.
# A sample of the tools definition file can be found in:
# - https://github.com/fortify/tool-definitions/releases/download/v1/tool-definitions.yaml.zip

name: Fortify SAST
on:
  workflow_dispatch:  # Allows manual trigger with inputs
    inputs:
      scan_type:
        description: 'Choose scan type'
        required: true
        default: 'fod-sast'
        type: choice
        options:
          - fod-sast
          - sc-sast
  push:
    branches:
      - 'dev/*'

env:
  FOD_RELEASE: "Petstore:v2"
  FOD_UPLOADER_NOTES: "Triggered by GitHub Actions Run ${{ github.run_number }}"

  SSC_APP_NAME: petstore
  SSC_APP_VER_NAME: "v2"

  SC_SAST_SARGS: "'-debug' '-verbose' '-build-label' 'GitHub Actions Run ${{ github.run_number }}'"

jobs:
  fortify-sast:
    name: Fortify SAST Scan
    runs-on: ubuntu-latest
    env:
      # Compute SCAN_TYPE: if this run is a push to dev/* use sc-sast, otherwise
      # prefer the workflow_dispatch input when present, falling back to fod-sast
      SCAN_TYPE: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/dev/') && 'sc-sast' || (github.event.inputs.scan_type != '' && github.event.inputs.scan_type) || 'fod-sast' }}
    strategy:
      matrix:
        java: [ 8 ]
        maven: [ '3.8.8' ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Maven
        uses: s4u/setup-maven-action@v1.19.0
        with:
          java-version: ${{ matrix.java }}
          maven-version: ${{ matrix.maven }}
      - name: Setup Fortify tools
        uses: fortify/github-action/setup@v2
        with:
          export-path: true
          fcli: latest
          sc-client: latest

      - name: Fortify on Demand -Package Source Code
        if: ${{ env.SCAN_TYPE == 'fod-sast' }}
        run: |
          ${SC_CLIENT_CMD} package -oss
      - name: Fortify on Demand - SAST
        if: ${{ env.SCAN_TYPE == 'fod-sast' }}
        run: |
          ${FCLI_CMD} fod session login --url ${{ vars.FOD_PORTAL_URL }} --client-id ${{secrets.FOD_API_KEY}} --client-secret ${{secrets.FOD_API_SECRET}}
          ${FCLI_CMD} fod sast-scan start -f fortifypackage.zip --rel "${{env.FOD_RELEASE}}" --notes="${{env.FOD_UPLOADER_NOTES}}" --store fod_sast_scan
          ${FCLI_CMD} fod sast-scan wait-for ::fod_sast_scan::
          ${FCLI_CMD} fod session logout

