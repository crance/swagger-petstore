           ${FCLI_CMD} sc-sast scan start -f fortifypackage.zip --publish-to "${{env.SSC_APP_NAME}}:${{env.SSC_APP_VER_NAME}}" --store sc_sast_scan --no-replace
           ${FCLI_CMD} sc-sast scan wait-for ::sc_sast_scan::
